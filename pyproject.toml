[project]
name = "threebody"
version = "0.1.0"
description = "Dreikörperproblem mit austauschbaren Integratoren (für den r3-Workshop)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy"]

[project.scripts]
threebody = "threebody.cli:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["uv_build>=0.8,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""     # Paket liegt direkt im Repo (nicht in src/), damit PYTHONPATH=repo reicht
